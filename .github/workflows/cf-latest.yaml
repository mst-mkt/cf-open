name: cf-latest

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check against the latest cf
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testdata/cf-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the latest cf
        run: npm install --no-save --ignore-scripts --no-audit --no-fund cf@latest
      - name: Show the installed versions
        run: npm ls cf @cloudflare/config
      - name: Compare the dashboard URLs
        run: |
          go run ../../cmd/cf-open --print --all --mode production --config cloudflare.config.ts > actual.txt
          diff -u expected.txt actual.txt
